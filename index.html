<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOBCARD - Control de Reservas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-title">
            <h1>Control de Reservas JOBCARD</h1>
        </div>
        
        <div class="inline-login">
            <label for="usuarioSelect">Usuario:</label>
            <select id="usuarioSelect">
                <option value="Edgar">Edgar</option>
                <option value="Ernestina">Ernestina</option>
            </select>

            <label for="passwordInput">Contraseña:</label>
            <input type="password" id="passwordInput" placeholder="Ingrese su clave">

            <button id="loginBtn">Ingresar</button>
        </div>
    </header>

    <main class="container">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>TR4</th>
                        <th>PIN / SN</th>
                        <th>Modelo</th>
                        <th>Cliente</th>
                        <th>Fecha Creación</th>
                        <th>Creado Por</th>
                        <th>Técnico</th>
                        <th>Estado</th>
                        <th>Estado Unidad</th>
                        <th>Actividades</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
