<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOBCARD - Control de Reservas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Encabezado Principal Corporativo -->
    <header class="header-bar">
        <div class="logo-container">
            <h1>Control de Reservas JOBCARD</h1>
        </div>
        
        <div class="login-container">
            <div class="login-field">
                <label for="usuarioSelect">Usuario:</label>
                <select id="usuarioSelect">
                    <option value="Edgar">Edgar</option>
                    <option value="Ernestina">Ernestina</option>
                </select>
            </div>

            <div class="login-field">
                <label for="passwordInput">Contraseña:</label>
                <input type="password" id="passwordInput" placeholder="Ingrese su clave">
            </div>

            <button id="loginBtn" class="btn-ingresar">Ingresar</button>
        </div>
    </header>

    <!-- Área de Contenido Principal -->
    <main class="main-content">
        <!-- Barra Superior de Herramientas / Búsqueda -->
        <div class="toolbar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Buscar por cliente, modelo, técnico, TR4...">
            </div>
        </div>

        <!-- Tabla Estilizada de Datos -->
        <div class="table-wrapper">
            <table class="jobcard-table">
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>TR4</th>
                        <th>PIN / SN</th>
                        <th>Modelo</th>
                        <th>Cliente</th>
                        <th>Fecha Creación</th>
                        <th>Creado Por</th>
                        <th>Técnico</th>
                        <th>Estado</th>
                        <th>Estado Unidad</th>
                        <th>Actividades</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Registros generados mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
