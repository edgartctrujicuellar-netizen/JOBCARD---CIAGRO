<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOBCARD - Control de Reservas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <header class="navbar">
        <div class="logo-title">
            <h1>Control de Reservas JOBCARD</h1>
        </div>
        <div class="user-status-area">
            <span id="userBadge" class="badge">Invitado (Solo Lectura)</span>
            <button id="btnOpenLogin" class="btn-login">Iniciar Sesión</button>
        </div>
    </header>

    <main class="container">
        <!-- Panel de Búsqueda y Filtrado -->
        <section class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por cliente, modelo, técnico, TR4...">
            </div>
        </section>

        <!-- Tabla de Datos -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID Reserva</th>
                        <th>TR4</th>
                        <th>PIN / SN</th>
                        <th>Modelo</th>
                        <th>Cliente</th>
                        <th>Fecha Creación</th>
                        <th>Creado Por</th>
                        <th>Técnico</th>
                        <th>Estado</th>
                        <th>Estado Unidad</th>
                        <th>Actividades</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Inicio de Sesión -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Acceso de Usuario</h2>
            <div class="form-group">
                <label for="usuarioSelect">Usuario:</label>
                <select id="usuarioSelect">
                    <option value="Edgar">Edgar</option>
                    <option value="Ernestina">Ernestina</option>
                </select>
            </div>
            <div class="form-group">
                <label for="passwordInput">Contraseña:</label>
                <input type="password" id="passwordInput" placeholder="Ingrese su contraseña">
            </div>
            <div class="modal-actions">
                <button id="btnCloseLogin" class="btn-secondary">Cancelar</button>
                <button id="loginBtn" class="btn-primary">Ingresar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
