<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Reservas y Actividades</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        /* Regla CSS para resaltar toda la fila cuando falte el TR4 */
        tr.tr4-vacio {
            background-color: #ffcccc !important; /* Rojo claro / rosado */
            color: #900000;
        }
        tr.tr4-vacio td {
            background-color: #ffcccc !important;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Control de Reservas y Actividades</h1>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <p style="color: #ffffff; font-size: 12px; margin: 0;">Buscador de estado de unidades en tiempo real</p>
            <button id="btnLogin" class="btn-auth">Ingresar como Editor</button>
        </div>
    </header>

    <div class="container">
        <!-- Panel de control de edición -->
        <div id="editorPanel" class="editor-bar" style="display: none;">
            <span>Modo Editor Activo: <strong id="lblUsuario"></strong></span>
            <div>
                <button id="btnAddRow" class="btn-action">+ Agregar Fila</button>
                <button id="btnSave" class="btn-primary">Guardar Cambios en Excel</button>
                <button id="btnLogout" class="btn-secondary">Cerrar Sesión</button>
            </div>
        </div>

        <!-- Panel de Búsqueda y Filtros Ajustados -->
        <div class="search-panel" style="display: flex; flex-wrap: wrap; gap: 10px;">
            <div style="display: flex; gap: 8px; flex: 1; min-width: 320px;">
                <select id="searchField" style="width: 170px;">
                    <option value="ID de la reserva">ID de la reserva</option>
                    <option value="TR4">TR4</option>
                    <option value="PIN/SN">PIN/SN</option>
                    <option value="CLIENTE">Nombre del cliente</option>
                    <option value="Modelo">Modelo</option>
                </select>
                <input type="text" id="searchInput" placeholder="Buscar..." style="flex: 1;">
            </div>

            <!-- Filtros de Estado y Fechas (Año, Mes, Semana) -->
            <div class="filters" style="display: flex; gap: 8px; flex-wrap: wrap;">
                <!-- Filtro por Estado de la Tarjeta -->
                <select id="filterEstado">
                    <option value="">Todos los Estados</option>
                    <option value="ABIERTO">ABIERTO</option>
                    <option value="EN PROCESO">EN PROCESO</option>
                    <option value="CERRADO">CERRADO</option>
                    <option value="PENDIENTE">PENDIENTE</option>
                </select>

                <!-- Buscador de fechas por Año, Mes y Semana -->
                <select id="filterAnio">
                    <option value="">Todos los Años</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                </select>

                <select id="filterMes">
                    <option value="">Todos los Meses</option>
                    <option value="01">Enero</option>
                    <option value="02">Febrero</option>
                    <option value="03">Marzo</option>
                    <option value="04">Abril</option>
                    <option value="05">Mayo</option>
                    <option value="06">Junio</option>
                    <option value="07">Julio</option>
                    <option value="08">Agosto</option>
                    <option value="09">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>

                <input type="week" id="filterSemana" title="Seleccionar Semana del Año">
            </div>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ID RESERVA</th>
                        <th>TR4</th>
                        <th>PIN / SN</th>
                        <th>MODELO</th>
                        <th>CLIENTE</th>
                        <th>FECHA CREACIÓN</th>
                        <th>CREADO POR</th>
                        <th>ESTADO</th>
                        <th>ESTADO UNIDAD</th>
                        <th>ACTIVIDADES</th>
                        <th class="col-acciones" style="display: none;">ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="11" class="loading">Cargando datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Inicio de Sesión -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3>Acceso Restringido</h3>
            <p>Ingrese sus credenciales para editar los datos</p>
            <input type="text" id="txtUser" placeholder="Usuario">
            <input type="password" id="txtPass" placeholder="Contraseña">
            <div class="modal-buttons">
                <button id="btnConfirmLogin" class="btn-primary">Ingresar</button>
                <button id="btnCancelLogin" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
